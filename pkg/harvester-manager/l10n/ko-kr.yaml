harvesterManager:
  manage: 관리
  tableHeaders:
    kubernetesVersion: Kubernetes 버전
    harvesterVersion: Infinitystack 버전
  cluster:
    label: Infinitystack 클러스터
    none: Infinitystack 클러스터가 없습니다
    learnMore: <a target="_blank" href="https://harvesterhci.io/" rel="noopener noreferrer nofollow">Infinitystack 웹사이트</a>에서 Infinitystack에 대해 자세히 알아보거나 <a target="_blank" href="https://docs.harvesterhci.io/" rel="noopener noreferrer nofollow">Infinitystack 문서</a>를 읽어보세요.
    description: Infinitystack은 Kubernetes, Kubevirt, Longhorn 등의 엔터프라이즈급 오픈소스 기술을 사용하여 베어 메탈 서버용으로 구축된 최신 하이퍼컨버지드 인프라(HCI) 솔루션입니다.
    supportMessage: Infinitystack UI 확장 기능은 1.3.0 이상의 Infinitystack 클러스터 버전만 지원합니다.
  plugins:
    loadError: Infinitystack 플러그인을 로드하는 중 오류가 발생했습니다.
  extension:
    install:
      warning: "Infinitystack UI 확장 프로그램이 설치되지 않았습니다."
      prompt: "Infinitystack의 UI 통합은 이제 설치가 필요한 새로운 Infinitystack UI 확장 프로그램을 통해 제공됩니다."
      prompt-standard-user: 시스템 관리자에게 문의하세요.
      steps:
        repo:
          1: 이동
          2: 앱 저장소
          3: 페이지를 열고 <a target="_blank" href="https://github.com/harvester/harvester-ui-extension" rel="noopener noreferrer nofollow">Infinitystack 저장소</a>를 추가하세요.
        ui:
          1: 이동
          2: 확장
          3: 페이지로 이동하여 Infinitystack 확장 프로그램을 설치하세요.
    update:
      warning: "Infinitystack UI 확장 프로그램이 업데이트되지 않았습니다."
      prompt: "새 버전이 출시되었습니다. 최신 Infinitystack UI 확장 프로그램을 설치하려면 업데이트 버튼을 클릭하세요."
      prompt-standard-user: 최신 버전을 설치하려면 시스템 관리자에게 문의하세요.
    missingRepo:
      warning: "Infinitystack UI 확장 저장소가 없습니다."
      prompt: "Infinitystack 저장소를 추가하고 최신 Infinitystack UI 확장 프로그램이 있는 경우 이를 설치하려면 업데이트 버튼을 클릭하십시오."
      prompt-standard-user: 최신 Infinitystack UI 확장 프로그램이 있는 경우 시스템 관리자에게 문의하여 설치하십시오.
    missingVersion:
      warning: "호환되는 버전을 찾을 수 없습니다"
      prompt: "Infinitystack UI 확장 프로그램의 최신 호환 버전을 받으려면 Barastack를 업데이트하거나 수동으로 설치해 보세요."
      prompt-standard-user: 시스템 관리자에게 문의하세요.
    error:
      warning: "경고, Infinitystack UI 확장 자동 설치에 실패했습니다."
      prompt: "페이지를 새로 고치고 다시 시도하거나 Infinitystack UI 확장 프로그램을 수동으로 설치하세요."
      prompt-standard-user: Infinitystack 확장 프로그램을 설치하거나 업데이트하려면 시스템 관리자에게 문의하세요.
  rke:
    templateError: 잘못된 템플릿 형식
  affinity:
    thisPodNamespace: 이 VM의 네임스페이스
    matchExpressions:
      inNamespaces: "이 네임스페이스의 워크로드"
    vmAffinityTitle: VM 스케줄링
    namespaces:
      placeholder: e.g. default,system,base
      label: 네임스페이스
    addLabel: 워크로드 선택기 추가
    topologyKey:
      placeholder: 'topology.kubernetes.io/zone'
  vGpu:
    title: VGPUs
    label: VGPU 유형
    placeholder: 'VGPU를 선택해주세요'
    allocatable: 할당 가능
    allocatableUnknown: 누락된 할당 정보
  cpuModel:
    label: CPU 모델
    optionLabel: "{modelName} (준비된 노드: {count})"
  gpu:
    sectionTitle: GPU 설정 (PCI 패스스루)
    sectionHelp: "이 머신 풀에 물리적 NVIDIA GPU(A100, H100, A200, H200 등) PCI 패스스루를 구성합니다. Infinitystack에서 Enable Passthrough가 활성화된 장치만 연결할 수 있습니다."
    enableGpu: "GPU 활성화 (PCI 패스스루)"
    enablePassthrough: "PCI 패스스루 (활성화됨)"
    quantityWarning: "선택한 PCI 장치는 하나의 VM에만 할당할 수 있습니다. 현재 풀 수량은 {count}개입니다. PCI 패스스루의 경우 GPU당 수량을 1로 설정하세요."
    noPassthroughDevicesTitle: "패스스루 활성화된 GPU 없음:"
    noPassthroughDevicesHelp: "물리 GPU를 VM에 연결하려면 먼저 해당 장치에서 PCI Passthrough를 활성화해야 합니다. Infinitystack UI의 [고급(Advanced) > PCI 장치]로 이동하여 원하는 GPU의 'Enable Passthrough'를 실행해 주세요."
    noAvailableDevicesTitle: "사용 가능한 패스스루 GPU 없음:"
    noAvailableDevicesHelp: "모든 NVIDIA GPU가 이미 다른 VM에 할당되어 있거나 PCI 패스스루가 활성화되어 있지 않습니다. Infinitystack UI의 [고급 > PCI 장치]에서 미할당된 GPU의 'Enable Passthrough'를 활성화해 주세요."
    errors:
      deviceRequired: "GPU 패스스루를 위해 PCI 장치를 선택해야 합니다."
      notNvidia: "선택한 PCI 장치가 NVIDIA GPU가 아닙니다."
      singleVmOnly: "선택한 PCI 장치는 하나의 VM에만 할당할 수 있습니다."
      passthroughNotEnabled: "선택한 PCI 장치는 Infinitystack에서 패스스루(Enable Passthrough)가 활성화되어 있지 않습니다. Infinitystack UI에서 먼저 패스스루를 활성화해 주세요."
